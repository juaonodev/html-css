<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>

        table{ 
            font-family: Arial, Helvetica, sans-serif;
            width: 400px;
            height: 400px;
            font-weight: bolder;
            border-collapse: collapse; /* UNEM AS LINHAS DA TABELA */
        }
        td{ 
            border: 1px solid black;
            text-align: center; /* ALINHAMENTO HORIZONTAL */
            vertical-align: middle ; /* ALINHAMENTO VERTICAL */
            
        }

    </style>
</head>


<body>
    <h1>Brincando e aprendendo Tabelas</h1>

    <!-- Hierarquia de tabela simples
        TABLE = Tabela     
            TABLE ROW (tr) = Linha de tabela
                TABLE HEADER = Cabeçalho de tabela
                TABLE DATA (td) = Dado(conteúdo) de tabela
    -->

    <table>
        <tr class="vermelho">
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr class="cinza">
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr class="azul">
            <td>A3</td>
            <td>D3</td>
            <td>C3</td>
        </tr>
        <tr>
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
