<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags html</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir.Passeo mouse sobre os termos para descobrir qual a tag deverá utlizar em cada caso.</p>
    <p>
        <ul style="list-style: square;">
            <li title="use a tag &lt;p&gt; ">Parágrafo</li>
            <li title="use a tag &lt;title&gt;">Títulos</li>
            <li title="use a tag &lt;img&gt;">Imagens</li>
            <li title="use a tag &lt;abbr&gt;">Abreviações</li>
            <li title="use a tag &lt;code&gt;">Código-fonte</li>
            <li title="use a tag &lt;ol&gt;">Listas numeradas</li>
            <li title="use a tag &lt;ul&gt;">Listas com demarcadores</li>
        </ul>
    </p>
</body>
</html>
